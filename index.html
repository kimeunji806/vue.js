<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const server = `https://jsonplaceholder.typicode.com/posts`;

      // 전체조회
      fetch(`https://jsonplaceholder.typicode.com/posts`)
        .then((res) => res.json())
        .then((data) => {
          console.log("전체조회", data);
        })
        .catch((err) => console.log(err));

      // 단건조회
      fetch("https://jsonplaceholder.typicode.com/posts/1")
        .then((res) => res.json())
        .then((data) => {
          console.log("단건조회", data);
        })
        .catch((err) => console.log(err));

      // 등록
      fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "POST",
        body: JSON.stringify({
          userId: 4,
          title: "테스트",
          body: "테스트입니다",
        }),
        headers: {
          "Content-type": "application/json",
        },
      })
        .then((res) => res.json())
        .then((data) => {
          console.log("등록:", data);
        })
        .catch((err) => console.log(err));

      // 수정
      fetch("https://jsonplaceholder.typicode.com/posts/1", {
        method: "PUT",
        body: JSON.stringify({
          userId: 1,
          title: "테스트",
          body: "테스트입니다",
          id: 1,
        }),
        headers: {
          "Content-type": "application/json",
        },
      })
        .then((res) => res.json())
        .then((data) => {
          console.log("수정:", data);
        })
        .catch((err) => console.log(err));

      // 삭제
      fetch("https://jsonplaceholder.typicode.com/posts/1", {
        method: "delete",
      })
        .then((res) => res.json())
        .then((data) => {
          console.log("삭제:", data);
        })
        .catch((err) => console.log(err));
    </script>
  </body>
</html>
